AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Worko Batch Inference OpenSearch and Firestore Updater

Parameters:
  Environment:
    Type: String
    Description: The deployment environment (dev or prod)
    Default: dev
    AllowedValues:
      - dev
      - prod
    
  OpenSearchIndex:
    Type: String
    Description: The name of the OpenSearch index to update
    Default: worko-jobs
    
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket containing batch inference output files
    Default: worko-batch-inference-dev
    
  S3Prefix:
    Type: String
    Description: The prefix (folder path) in the S3 bucket where batch inference output files are stored
    Default: output/
    
  LambdaMemorySize:
    Type: Number
    Description: Memory size for the Lambda function in MB
    Default: 512
    
  LambdaTimeout:
    Type: Number
    Description: Timeout for the Lambda function in seconds
    Default: 840  # 14 minutes
    
  VectorIndexLambda:
    Type: String
    Description: Lambda function name for vector index generation
    Default: worko-s3-vector-job-ingestion
    
  VectorIndexName:
    Type: String
    Description: Vector index name
    Default: worko-s3-jobs-index
    
  # VPC configuration removed as Lambda now calls another Lambda function outside VPC

Resources:
  WorkoBatchInferenceUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: worko-job-batch-inference-update-function
      Description: Lambda function to update OpenSearch with batch inference results
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          OPENSEARCH_INDEX: !Ref OpenSearchIndex
          S3_BUCKET: !Ref S3BucketName
          S3_PREFIX: !Ref S3Prefix
          OPENSEARCH_LAMBDA_DEV: worko-job-app-dev-app-opensearch-operations
          OPENSEARCH_LAMBDA_PROD: worko-job-app-prod-app-opensearch-operations
          VECTOR_INDEX_LAMBDA: !Ref VectorIndexLambda
          VECTOR_INDEX_NAME: !Ref VectorIndexName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - S3WritePolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:worko-job-app-dev-app-opensearch-operations"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:worko-job-app-prod-app-opensearch-operations"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${VectorIndexLambda}"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:worko-vector-store-job-crud-prod"
    Metadata:
      BuildMethod: makefile

  NotFoundLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${S3BucketName}-logs"
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30

  WorkoBatchInferenceFirestoreUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: worko-job-batch-inference-firestore-update-function
      Description: Lambda function to update GCP Firestore with Bedrock batch inference results
      CodeUri: ./
      Handler: lambda_function_firestore.lambda_handler
      Runtime: python3.9
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          S3_BUCKET: !Ref S3BucketName
          S3_PREFIX: !Ref S3Prefix
          VECTOR_INDEX_LAMBDA: !Ref VectorIndexLambda
          VECTOR_INDEX_NAME: !Ref VectorIndexName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - S3WritePolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:GCP-firestore-secret-${Environment}-*"
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${VectorIndexLambda}"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:worko-vector-store-job-crud-prod"
    Metadata:
      BuildMethod: makefile

  WorkoBatchInferenceFirestoreGcpUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: worko-job-batch-inference-firestore-gcp-update-function
      Description: Lambda function to update GCP Firestore with GCP Vertex AI batch inference results
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          VECTOR_INDEX_LAMBDA: !Ref VectorIndexLambda
          VECTOR_INDEX_NAME: !Ref VectorIndexName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:GCP-firestore-secret-${Environment}-*"
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${VectorIndexLambda}"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:worko-vector-store-job-crud-prod"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /process
            Method: POST
            RestApiId: !Ref GcpFirestoreApi
    Metadata:
      DockerTag: v1
      DockerContext: ./
      Dockerfile: Dockerfile

  GcpFirestoreApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: GcpFirestoreUsagePlan

  GcpFirestoreApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - GcpFirestoreApiprodStage
    Properties:
      Name: GcpFirestoreApiKey
      Enabled: true
      StageKeys:
        - RestApiId: !Ref GcpFirestoreApi
          StageName: prod

  GcpFirestoreUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - GcpFirestoreApiprodStage
    Properties:
      UsagePlanName: GcpFirestoreUsagePlan
      ApiStages:
        - ApiId: !Ref GcpFirestoreApi
          Stage: prod

  GcpFirestoreUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref GcpFirestoreApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref GcpFirestoreUsagePlan

Outputs:
  WorkoBatchInferenceUpdaterFunction:
    Description: Lambda function for updating OpenSearch with batch inference results
    Value: !GetAtt WorkoBatchInferenceUpdaterFunction.Arn
  
  WorkoBatchInferenceFirestoreUpdaterFunction:
    Description: Lambda function for updating GCP Firestore with Bedrock batch inference results
    Value: !GetAtt WorkoBatchInferenceFirestoreUpdaterFunction.Arn
  
  WorkoBatchInferenceFirestoreGcpUpdaterFunction:
    Description: Lambda function for updating GCP Firestore with GCP Vertex AI batch inference results
    Value: !GetAtt WorkoBatchInferenceFirestoreGcpUpdaterFunction.Arn
  
  GcpFirestoreApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${GcpFirestoreApi}.execute-api.${AWS::Region}.amazonaws.com/prod/process"
  
  ApiKeyId:
    Description: API Key ID (use AWS Console to get the actual key value)
    Value: !Ref GcpFirestoreApiKey
