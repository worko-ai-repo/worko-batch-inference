AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Worko Batch Inference OpenSearch Updater

Parameters:
  OpenSearchEndpoint:
    Type: String
    Description: The endpoint URL of your OpenSearch domain
    
  OpenSearchIndex:
    Type: String
    Description: The name of the OpenSearch index to update
    Default: worko-jobs
    
  S3BucketName:
    Type: String
    Description: The name of the S3 bucket containing batch inference output files
    Default: worko-batch-inference-dev
    
  S3Prefix:
    Type: String
    Description: The prefix (folder path) in the S3 bucket where batch inference output files are stored
    Default: output/
    
  LambdaMemorySize:
    Type: Number
    Description: Memory size for the Lambda function in MB
    Default: 512
    
  LambdaTimeout:
    Type: Number
    Description: Timeout for the Lambda function in seconds
    Default: 600  # 10 minutes
    
  VpcId:
    Type: String
    Description: The ID of the VPC where the Lambda function will run
    
  SubnetIds:
    Type: CommaDelimitedList
    Description: The IDs of the subnets where the Lambda function will run (comma-delimited list)
    
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: The IDs of the security groups to associate with the Lambda function (comma-delimited list)

Resources:
  WorkoBatchInferenceUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: worko-job-batch-inference-update-function
      Description: Lambda function to update OpenSearch with batch inference results
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_INDEX: !Ref OpenSearchIndex
          S3_BUCKET: !Ref S3BucketName
          S3_PREFIX: !Ref S3Prefix
      VpcConfig:
        SecurityGroupIds: !Ref SecurityGroupIds
        SubnetIds: !Ref SubnetIds
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - S3WritePolicy:
            BucketName: !Ref S3BucketName
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - es:ESHttpGet
                - es:ESHttpPost
                - es:ESHttpPut
              Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
      Events:
        BedrockBatchInferenceCompletion:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.bedrock
              detail-type:
                - Batch Inference Job State Change
              detail:
                status:
                  - Completed

  NotFoundLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${S3BucketName}-logs"
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30

Outputs:
  WorkoBatchInferenceUpdaterFunction:
    Description: Lambda function for updating OpenSearch with batch inference results
    Value: !GetAtt WorkoBatchInferenceUpdaterFunction.Arn
    
  NotFoundLogsBucket:
    Description: S3 bucket for storing logs of records not found in OpenSearch
    Value: !Ref NotFoundLogsBucket
